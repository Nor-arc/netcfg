[package]
name = "netcfg-py"
version = "0.3.0"
edition = "2021"
build = "build.rs"

[lib]
name = "netcfg"
crate-type = ["cdylib"]

[dependencies]
netcfg-core = { package = "netcfg", path = "../netcfg", default-features = false }
pyo3 = { version = "=0.22.6", features = ["extension-module"] }
serde_json = "=1.0.111"
